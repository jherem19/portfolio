function updateConversion(){const raster=conversion.value==='raster';if(raster!==rasterActive){if(raster){editableResolution=resolution.value;resolution.value=rasterResolution;}else{rasterResolution=resolution.value;resolution.value=editableResolution;}rasterActive=raster;}resolution.title=raster?'1× is faster; 2× adds detail without changing layer size.':'Resolution for images and raster fallbacks';for(const id of ['text','group']){const input=document.getElementById(id);input.disabled=raster;input.closest('.toggle').style.opacity=raster?'0.45':'1';}}
conversion.onchange=updateConversion;updateConversion();
function scriptFor(scene){const json=JSON.stringify(scene).replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');return '#target aftereffects\n(function(){\n'+runtime+'\nimportFigmaScene('+json+');\n}());\n';}
function download(scene){
  const url=URL.createObjectURL(new Blob([scriptFor(scene)],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');
  a.href=url;a.download=(scene.name.replace(/[<>:"/\\|?*\x00-\x1f]/g,'_').slice(0,70).replace(/[. ]+$/,'')||'Figma')+'.jsx';
  document.body.appendChild(a);a.click();a.remove();status.textContent='Script ready. In AE: File → Scripts → Run Script File.';
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
function prepare(direct){
  const duration=Number(document.getElementById('duration').value);
  if(!Number.isFinite(duration)||duration<1||duration>3600){status.textContent='Duration must be between 1 and 3600 seconds.';return;}
  busy=true;updateButton();showReport([]);status.textContent=conversion.value==='raster'?'Rasterizing selection…':'Preparing selection…';
  const raster=conversion.value==='raster';
  parent.postMessage({pluginMessage:{type:'export',direct,precomposeSelection:document.getElementById('precompose').checked,fps:Number(document.getElementById('fps').value),duration,rasterScale:Number(document.getElementById('scale').value),rasterSelection:raster,preferEditable:conversion.value==='editable',editableText:!raster&&document.getElementById('text').checked,groupShapes:!raster&&document.getElementById('group').checked,centerInComp:document.getElementById('position').value==='center',keepFigmaPosition:document.getElementById('position').value==='figma'}},'*');
}
function showReport(lines){report.textContent=lines.join('\n');document.getElementById('report-box').hidden=!lines.length;}
const placements=[...document.querySelectorAll('[data-position]')];
function choosePlacement(choice){document.getElementById('position').value=choice.dataset.position;for(const item of placements){const active=item===choice;item.setAttribute('aria-checked',String(active));item.tabIndex=active?0:-1;}}
for(const choice of placements){choice.onclick=()=>choosePlacement(choice);choice.onkeydown=event=>{const i=placements.indexOf(choice);let next;if(event.key==='ArrowRight'||event.key==='ArrowDown')next=(i+1)%placements.length;else if(event.key==='ArrowLeft'||event.key==='ArrowUp')next=(i+placements.length-1)%placements.length;else if(event.key==='Home')next=0;else if(event.key==='End')next=placements.length-1;else return;event.preventDefault();choosePlacement(placements[next]);placements[next].focus();};}
document.getElementById('connection-toggle').onclick=()=>{const panel=document.getElementById('connection-panel');panel.hidden=!panel.hidden;};
document.getElementById('pair').onclick=()=>{document.getElementById('connection-error').textContent='Connecting…';parent.postMessage({pluginMessage:{type:'bridge-pair',code:document.getElementById('connection-code').value}},'*');};
document.getElementById('forget').onclick=()=>parent.postMessage({pluginMessage:{type:'bridge-forget'}},'*');
button.onclick=()=>prepare(true);fileButton.onclick=()=>prepare(false);
window.onmessage=event=>{
  const m=event.data.pluginMessage;if(!m)return;
  if(m.type==='selection'){count=m.count;updateButton();}
  if(m.type==='connection-error'){document.getElementById('connection-panel').hidden=false;document.getElementById('connection-error').textContent=m.message;}
  if(m.type==='bridge-paired'){document.getElementById('connection-code').value='';document.getElementById('connection-error').textContent='';document.getElementById('connection-panel').hidden=true;}
  if(m.type==='bridge-status'){if(m.configured===false){document.getElementById('connection-panel').hidden=false;document.getElementById('connection-code').value='';}document.getElementById('connection-toggle').textContent=m.configured?'Connection':'Connect';document.getElementById('connection').textContent=m.connected?'Connected':'Offline · start local bridge';document.getElementById('connection-badge').classList.toggle('connected',m.connected);}
  if(m.type==='sending'){status.textContent=m.rasterSelection?'Importing image in After Effects…':'Adding layers to the active AE composition…';}
  if(m.type==='error'){busy=false;updateButton();status.textContent=m.message;}
  if(m.type==='sent'){busy=false;updateButton();status.textContent=m.result.precomposition?'Precomp “'+m.result.precomposition.name+'” added to “'+m.result.composition+'”.':m.result.layers+' layers added to “'+m.result.composition+'”.';const lines=[...m.result.warnings];if(m.result.precomposition)lines.unshift(m.result.precomposition.layers+' layers inside the precomp');if(m.result.clipping)lines.unshift(m.result.clipping.created+' clip masks kept · '+m.result.clipping.omitted+' redundant clips skipped');showReport(lines);document.getElementById('connection').textContent='Connected';document.getElementById('connection-badge').classList.add('connected');}
  if(m.type==='exported'){busy=false;updateButton();lastScene=m.scene;download(lastScene);const s=lastScene.stats;showReport([s.shapes+' shapes · '+s.text+' text · '+s.images+' images',...lastScene.warnings]);}
};
parent.postMessage({pluginMessage:{type:'bridge-check'}},'*');
</script>
</html>
