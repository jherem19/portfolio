<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{font:13px Inter,Arial,sans-serif;margin:0;padding:20px;background:var(--figma-color-bg,#17191f);color:var(--figma-color-text,#edf0f9)}button,input,select{font:inherit}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.defs{position:absolute;width:0;height:0;overflow:hidden}header{display:flex;align-items:center;gap:10px}.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;color:#9aafff;background:#738fff20}.logo svg{width:24px;height:24px}h1{font-size:19px;letter-spacing:-.5px;margin:0}.version{font-size:10px;color:var(--figma-color-text-secondary,#aeb7ca);margin-left:auto}.meta{display:flex;align-items:center;justify-content:space-between;margin:13px 0 20px;font-size:11px;color:var(--figma-color-text-secondary,#aeb7ca)}.badge{display:flex;align-items:center;gap:6px}.dot{width:6px;height:6px;border-radius:50%;background:#9a9fad}.connected .dot{background:#56cb98}.section-label{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--figma-color-text-secondary,#aeb7ca);margin:16px 0 8px}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toggle{position:relative;cursor:pointer}.toggle input{position:absolute;opacity:0;width:1px;height:1px}.card{border:1px solid var(--figma-color-border,#3b4356);border-radius:10px;background:var(--figma-color-bg-secondary,#212631);padding:13px 12px;display:flex;align-items:center;gap:9px;min-height:65px;font-size:12px}.card .check{margin-left:auto;width:14px;height:14px;border:1px solid var(--figma-color-border,#727b91);border-radius:4px;display:grid;place-items:center}.check svg{width:12px;height:12px;visibility:hidden;stroke-width:2.5}.toggle input:checked+.card{border-color:#738fff;background:#738fff12}.toggle input:checked+.card>svg{color:#9aafff}.toggle input:checked+.card .check{background:#738fff;border-color:#738fff;color:#11182c}.toggle input:checked+.card .check svg{visibility:visible}.toggle input:focus-visible+.card,button:focus-visible,select:focus-visible,input[type=number]:focus-visible{outline:2px solid #9aafff;outline-offset:3px}.placement{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:5px;border:1px solid var(--figma-color-border,#3b4356);border-radius:10px;background:var(--figma-color-bg-secondary,#212631)}.placement button{display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:6px;background:transparent;color:var(--figma-color-text-secondary,#aeb7ca);padding:9px 4px;font-size:12px;cursor:pointer}.placement svg{width:17px;height:17px}.placement [aria-checked=true]{background:#738fff;color:#11182c;font-weight:600}.row{display:flex;gap:12px;margin:16px 0}.row label{flex:1;min-width:0}.field-label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--figma-color-text-secondary,#aeb7ca);margin-bottom:6px}.field-label svg{width:15px;height:15px}select,input[type=number]{width:100%;padding:9px;border:1px solid var(--figma-color-border,#3b4356);border-radius:7px;background:var(--figma-color-bg-secondary,#212631);color:inherit}.send,.secondary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border:0;border-radius:9px;background:#738fff;color:#11182c;font-weight:650;cursor:pointer}.send:disabled,.secondary:disabled{opacity:.45;cursor:default}.secondary{background:transparent;color:inherit;border:1px solid var(--figma-color-border,#3b4356);font-size:12px;padding:9px}.send svg{width:18px;height:18px}#status{font-size:11px;line-height:1.5;color:var(--figma-color-text-secondary,#aeb7ca);margin:10px 0;min-height:17px;white-space:pre-wrap}details{margin-top:12px;font-size:11px;color:var(--figma-color-text-secondary,#aeb7ca)}details[hidden]{display:none}summary{cursor:pointer;padding:3px 0}#report{font:11px/1.5 Inter,Arial,sans-serif;max-height:105px;overflow:auto;white-space:pre-wrap}.advanced{border-top:1px solid var(--figma-color-border,#3b4356);padding-top:12px}.advanced .row{margin:10px 0}
.precomp{grid-column:1/-1}.precomp .card{min-height:44px;padding:10px 12px}
.connection-panel{margin:0 0 16px;padding:12px;border:1px solid var(--figma-color-border,#3b4356);border-radius:10px}.connection-panel p{font-size:11px;line-height:1.5}.connection-panel input{width:100%;padding:9px;border:1px solid var(--figma-color-border,#3b4356);border-radius:7px;background:var(--figma-color-bg-secondary,#212631);color:inherit;margin-bottom:8px}.connection-panel .secondary{margin-top:8px}#connection-toggle{border:0;background:none;color:#9aafff;font-size:11px;cursor:pointer;margin-left:7px}</style>
<svg class="defs" aria-hidden="true"><defs>
<symbol id="i-transfer" viewBox="0 0 24 24"><path d="M4 7h15m-4-4 4 4-4 4M20 17H5m4-4-4 4 4 4"/></symbol>
<symbol id="i-text" viewBox="0 0 24 24"><path d="M4 6V4h16v2M12 4v16m-4 0h8"/></symbol>
<symbol id="i-group" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/><path d="M15 4h5v5M4 15v5h5"/></symbol>
<symbol id="i-precomp" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><rect x="7" y="8" width="7" height="6" rx="1"/><path d="M10 17h7v-6"/></symbol>
<symbol id="i-center" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M12 2v5m0 10v5M2 12h5m10 0h5"/></symbol>
<symbol id="i-pin" viewBox="0 0 24 24"><path d="M18 10c0 4-6 10-6 10S6 14 6 10a6 6 0 0 1 12 0Z"/><circle cx="12" cy="10" r="2"/></symbol>
<symbol id="i-origin" viewBox="0 0 24 24"><path d="M5 19V5h14M9 9h8v8H9Z"/></symbol>
<symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="m4 18 6-6 4 4 3-3 4 4"/></symbol>
<symbol id="i-mode" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4 10-10"/></symbol>
</defs></svg>
<header><div class="logo"><svg aria-hidden="true"><use href="#i-transfer"/></svg></div><h1>AE Bridge</h1><span class="version">__BRIDGE_VERSION__</span></header>
<div class="meta"><span class="badge" id="connection-badge"><span class="dot"></span><span id="connection" role="status">Checking bridge…</span></span><span><button id="connection-toggle" type="button">Connect</button> <span id="selection-count"></span></span></div>
<div class="connection-panel" id="connection-panel" hidden><label for="connection-code">Connection code</label><p>Install the Windows companion, then paste the code from AE Bridge First steps. Keep your code private.</p><input id="connection-code" type="password" autocomplete="off" spellcheck="false" placeholder="AEBridge:38473:…"><button class="secondary" id="pair" type="button">Connect companion</button><button class="secondary" id="forget" type="button">Forget connection</button><p id="connection-error" role="status"></p></div>
<div class="options">
<label class="toggle" title="Keep editable point text. Missing fonts use AE’s default font. Complex styles may be simplified. Uncheck to send vector outlines."><input id="text" type="checkbox" checked aria-label="Editable text; missing fonts use the AE default"><span class="card"><svg aria-hidden="true"><use href="#i-text"/></svg><span>Editable text</span><span class="check"><svg aria-hidden="true"><use href="#i-check"/></svg></span></span></label>
<label class="toggle" title="Combine compatible vector groups into one shape layer with editable subgroups. Text stays separate."><input id="group" type="checkbox" aria-label="Group vectors into a shape layer"><span class="card"><svg aria-hidden="true"><use href="#i-group"/></svg><span>Group vectors</span><span class="check"><svg aria-hidden="true"><use href="#i-check"/></svg></span></span></label>
<label class="toggle precomp" title="Place this selection in one precomposition inside the active AE composition. Keep its layers editable and preserve placement."><input id="precompose" type="checkbox" aria-label="Import selection inside a precomposition"><span class="card"><svg aria-hidden="true"><use href="#i-precomp"/></svg><span>Precompose selection</span><span class="check"><svg aria-hidden="true"><use href="#i-check"/></svg></span></span></label>
</div>
<div class="section-label">Placement</div><input id="position" type="hidden" value="center">
<div class="placement" role="radiogroup" aria-label="Layer placement">
<button type="button" data-position="center" role="radio" aria-checked="true" aria-label="Center in composition" title="Center selection in the active composition"><svg aria-hidden="true"><use href="#i-center"/></svg>Center</button>
<button type="button" data-position="figma" role="radio" aria-checked="false" tabindex="-1" aria-label="Keep Figma position" title="Keep position inside the design frame matching the AE composition"><svg aria-hidden="true"><use href="#i-pin"/></svg>Figma</button>
<button type="button" data-position="origin" role="radio" aria-checked="false" tabindex="-1" aria-label="Selection at top-left" title="Place the selection at the top-left of the composition"><svg aria-hidden="true"><use href="#i-origin"/></svg>Origin</button>
</div>
<div class="row"><label><span class="field-label"><svg aria-hidden="true"><use href="#i-image"/></svg>Images</span><select id="scale" aria-label="Raster image resolution" title="Resolution for images and raster fallbacks"><option value="1">1×</option><option value="2" selected>2×</option></select></label><label><span class="field-label"><svg aria-hidden="true"><use href="#i-mode"/></svg>Conversion</span><select id="mode" aria-label="Conversion preference" title="Raster image sends the entire selection as one PNG. Appearance may flatten effects."><option value="editable" selected>Editable</option><option value="visual">Appearance</option><option value="raster">Raster image</option></select></label></div>
<button class="send" id="send" disabled><svg aria-hidden="true"><use href="#i-arrow"/></svg><span id="send-label">Select layers in Figma</span></button>
<p id="status" role="status" aria-live="polite">Send to the active AE composition.</p>
<details id="report-box" hidden><summary>Import report</summary><pre id="report"></pre></details>
<details class="advanced"><summary>Export .jsx</summary><div class="row"><label><span class="field-label">FPS</span><select id="fps"><option>24</option><option>25</option><option selected>30</option><option>60</option></select></label><label><span class="field-label">Duration (s)</span><input id="duration" type="number" min="1" max="3600" value="10"></label></div><button class="secondary" id="export" disabled>Save .jsx</button></details>
<script>
const runtime=__AE_RUNTIME__;
let busy=false,lastScene=null,count=0;
const button=document.getElementById('send'),fileButton=document.getElementById('export'),status=document.getElementById('status'),report=document.getElementById('report');
function updateButton(){button.disabled=busy||!count;fileButton.disabled=busy||!count;document.getElementById('send-label').textContent=busy?'Sending…':count?'Send to After Effects':'Select layers in Figma';document.getElementById('selection-count').textContent=count?count+' selected':'';}
const conversion=document.getElementById('mode');
const resolution=document.getElementById('scale');
let rasterActive=false,editableResolution=resolution.value,rasterResolution='1';
function updateConversion(){const raster=conversion.value==='raster';if(raster!==rasterActive){if(raster){editableResolution=resolution.value;resolution.value=rasterResolution;}else{rasterResolution=resolution.value;resolution.value=editableResolution;}rasterActive=raster;}resolution.title=raster?'1× is faster; 2× adds detail without changing layer size.':'Resolution for images and raster fallbacks';for(const id of ['text','group']){const input=document.getElementById(id);input.disabled=raster;input.closest('.toggle').style.opacity=raster?'0.45':'1';}}
conversion.onchange=updateConversion;updateConversion();
function scriptFor(scene){const json=JSON.stringify(scene).replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');return '#target aftereffects\n(function(){\n'+runtime+'\nimportFigmaScene('+json+');\n}());\n';}
function download(scene){
  const url=URL.createObjectURL(new Blob([scriptFor(scene)],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');
  a.href=url;a.download=(scene.name.replace(/[<>:"/\\|?*\x00-\x1f]/g,'_').slice(0,70).replace(/[. ]+$/,'')||'Figma')+'.jsx';
  document.body.appendChild(a);a.click();a.remove();status.textContent='Script ready. In AE: File → Scripts → Run Script File.';
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
function prepare(direct){
  const duration=Number(document.getElementById('duration').value);
  if(!Number.isFinite(duration)||duration<1||duration>3600){status.textContent='Duration must be between 1 and 3600 seconds.';return;}
  busy=true;updateButton();showReport([]);status.textContent=conversion.value==='raster'?'Rasterizing selection…':'Preparing selection…';
  const raster=conversion.value==='raster';
  parent.postMessage({pluginMessage:{type:'export',direct,precomposeSelection:document.getElementById('precompose').checked,fps:Number(document.getElementById('fps').value),duration,rasterScale:Number(document.getElementById('scale').value),rasterSelection:raster,preferEditable:conversion.value==='editable',editableText:!raster&&document.getElementById('text').checked,groupShapes:!raster&&document.getElementById('group').checked,centerInComp:document.getElementById('position').value==='center',keepFigmaPosition:document.getElementById('position').value==='figma'}},'*');
}
function showReport(lines){report.textContent=lines.join('\n');document.getElementById('report-box').hidden=!lines.length;}
const placements=[...document.querySelectorAll('[data-position]')];
function choosePlacement(choice){document.getElementById('position').value=choice.dataset.position;for(const item of placements){const active=item===choice;item.setAttribute('aria-checked',String(active));item.tabIndex=active?0:-1;}}
for(const choice of placements){choice.onclick=()=>choosePlacement(choice);choice.onkeydown=event=>{const i=placements.indexOf(choice);let next;if(event.key==='ArrowRight'||event.key==='ArrowDown')next=(i+1)%placements.length;else if(event.key==='ArrowLeft'||event.key==='ArrowUp')next=(i+placements.length-1)%placements.length;else if(event.key==='Home')next=0;else if(event.key==='End')next=placements.length-1;else return;event.preventDefault();choosePlacement(placements[next]);placements[next].focus();};}
document.getElementById('connection-toggle').onclick=()=>{const panel=document.getElementById('connection-panel');panel.hidden=!panel.hidden;};
document.getElementById('pair').onclick=()=>{document.getElementById('connection-error').textContent='Connecting…';parent.postMessage({pluginMessage:{type:'bridge-pair',code:document.getElementById('connection-code').value}},'*');};
document.getElementById('forget').onclick=()=>parent.postMessage({pluginMessage:{type:'bridge-forget'}},'*');
button.onclick=()=>prepare(true);fileButton.onclick=()=>prepare(false);
window.onmessage=event=>{
  const m=event.data.pluginMessage;if(!m)return;
  if(m.type==='selection'){count=m.count;updateButton();}
  if(m.type==='connection-error'){document.getElementById('connection-panel').hidden=false;document.getElementById('connection-error').textContent=m.message;}
  if(m.type==='bridge-paired'){document.getElementById('connection-code').value='';document.getElementById('connection-error').textContent='';document.getElementById('connection-panel').hidden=true;}
  if(m.type==='bridge-status'){if(m.configured===false){document.getElementById('connection-panel').hidden=false;document.getElementById('connection-code').value='';}document.getElementById('connection-toggle').textContent=m.configured?'Connection':'Connect';document.getElementById('connection').textContent=m.connected?'Connected':'Offline · start local bridge';document.getElementById('connection-badge').classList.toggle('connected',m.connected);}
  if(m.type==='sending'){status.textContent=m.rasterSelection?'Importing image in After Effects…':'Adding layers to the active AE composition…';}
  if(m.type==='error'){busy=false;updateButton();status.textContent=m.message;}
  if(m.type==='sent'){busy=false;updateButton();status.textContent=m.result.precomposition?'Precomp “'+m.result.precomposition.name+'” added to “'+m.result.composition+'”.':m.result.layers+' layers added to “'+m.result.composition+'”.';const lines=[...m.result.warnings];if(m.result.precomposition)lines.unshift(m.result.precomposition.layers+' layers inside the precomp');if(m.result.clipping)lines.unshift(m.result.clipping.created+' clip masks kept · '+m.result.clipping.omitted+' redundant clips skipped');showReport(lines);document.getElementById('connection').textContent='Connected';document.getElementById('connection-badge').classList.add('connected');}
  if(m.type==='exported'){busy=false;updateButton();lastScene=m.scene;download(lastScene);const s=lastScene.stats;showReport([s.shapes+' shapes · '+s.text+' text · '+s.images+' images',...lastScene.warnings]);}
};
parent.postMessage({pluginMessage:{type:'bridge-check'}},'*');
</script>
</html>
