name: Publish AE Bridge companion
on:
  push:
    branches: [main]
    paths: ["tools/ae-bridge/**", ".github/workflows/ae-bridge-release.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ae-bridge-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and verify public plugin
        shell: pwsh
        run: |
          node tools/ae-bridge/app/build.js --public
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/ae-bridge/verify-public.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download pinned runtime and build companion
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path work/installer-build,outputs | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri https://nodejs.org/dist/v24.19.0/node-v24.19.0-win-x64.zip -OutFile work/installer-build/node-v24.19.0-win-x64.zip
          & tools/ae-bridge/installer/build-installer.ps1 -NodeArchive work/installer-build/node-v24.19.0-win-x64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package public plugin and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version=(Get-Content tools/ae-bridge/app/version.json -Raw | ConvertFrom-Json).version
          $exe="outputs/AE-Bridge-Setup-$version.exe"
          $hash=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText((Join-Path (Get-Location) "outputs/AE-Bridge-Setup-$version.sha256"),("$hash  AE-Bridge-Setup-$version.exe"+[Environment]::NewLine))
          Compress-Archive -Path tools/ae-bridge/app/manifest.json,tools/ae-bridge/app/code.js,tools/ae-bridge/app/ui.html -DestinationPath "outputs/AE-Bridge-Figma-Community-$version.zip" -Force
          $tag="ae-bridge-v$version"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "AE Bridge Beta $version" --notes-file tools/ae-bridge/RELEASE-NOTES.md --prerelease }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $tag $exe "outputs/AE-Bridge-Setup-$version.sha256" "outputs/AE-Bridge-Figma-Community-$version.zip" --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
